seed: 0
deterministic: false

checkpoint_config:
  interval: 1
  max_keep_ckpts: 10

log_config:
  interval: 50
  hooks:
    -
      type: TextLoggerHook
    -
      type: TensorboardLoggerHook

load_from: null
resume_from: null

cudnn_benchmark: false
fp16: null
  # loss_scale: 
  #   growth_interval: 2000

max_epochs: 10
runner:
  type: CustomEpochBasedRunner
  max_epochs: ${max_epochs}
