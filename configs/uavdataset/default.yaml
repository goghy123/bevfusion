dataset_type: UAVDataset
dataset_root: data/uavdataset/

load_dim: 5
use_dim: 5
max_sweeps: 6

point_cloud_range: [-51.2, -51.2, -12.0, 51.2, 51.2, 14.0]
voxel_size: [0.1, 0.1, 0.2]
image_size: [320, 576]

augment2d:
  resize: [[0.45, 0.50], [0.45, 0.45]]
  rotate: [-5.4, 5.4]
  vertical_jitter: 0.25
  gridmask:
    prob: 0.0
    fixed_prob: true

augment3d:
  scale: [0.95, 1.05]
  rotate: [-0.78539816, 0.78539816]
  translate: 0.5


frustum_filter:
  # Geometry is computed from lidar2image + actual image size.
  # These are safety/quality thresholds, not FOV constants.
  min_depth: 0.05
  max_depth: null
  margin_px: 2.0
  min_points: 1000
  min_keep_ratio: 0.005
  mode: union
  on_threshold_failure: raise

object_classes:
  - car
  - van
  - truck
  - bus

input_modality:
  use_lidar: true
  use_camera: true
  use_radar: false
  use_map: false
  use_external: false

train_pipeline:
  -
    type: LoadMultiViewImageFromFiles
    to_float32: true
  -
    type: LoadPointsFromFile
    coord_type: LIDAR
    load_dim: ${load_dim}
    use_dim: ${use_dim}
  -
    type: LoadPointsFromMultiSweeps
    sweeps_num: ${max_sweeps}
    load_dim: ${load_dim}
    use_dim: ${use_dim}
    pad_empty_sweeps: false
    remove_close: false
  -
    type: LiDARCameraFrustumFilter
    min_depth: ${frustum_filter.min_depth}
    max_depth: ${frustum_filter.max_depth}
    margin_px: ${frustum_filter.margin_px}
    min_points: ${frustum_filter.min_points}
    min_keep_ratio: ${frustum_filter.min_keep_ratio}
    mode: ${frustum_filter.mode}
    on_threshold_failure: ${frustum_filter.on_threshold_failure}
  -
    type: LoadAnnotations3D
    with_bbox_3d: true
    with_label_3d: true
    with_attr_label: false
  -
    type: UAVImageAug3D
    final_dim: ${image_size}
    resize_lim: ${augment2d.resize[0]}
    bot_pct_lim: [0.0, 0.0]
    rot_lim: ${augment2d.rotate}
    rand_flip: true
    is_train: true
    vertical_jitter: ${augment2d.vertical_jitter}
  -
    type: GlobalRotScaleTrans
    resize_lim: ${augment3d.scale}
    rot_lim: ${augment3d.rotate}
    trans_lim: ${augment3d.translate}
    is_train: true
  -
    type: RandomFlip3D
  -
    type: PointsRangeFilter
    point_cloud_range: ${point_cloud_range}
  -
    type: UAVObjectRangeFilter3D
    point_cloud_range: ${point_cloud_range}
  -
    type: ObjectNameFilter
    classes: ${object_classes}
  -
    type: ImageNormalize
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  -
    type: GridMask
    use_h: true
    use_w: true
    max_epoch: ${max_epochs}
    rotate: 1
    offset: false
    ratio: 0.5
    mode: 1
    prob: ${augment2d.gridmask.prob}
    fixed_prob: ${augment2d.gridmask.fixed_prob}
  -
    type: PointShuffle
  -
    type: DefaultFormatBundle3D
    classes: ${object_classes}
  -
    type: Collect3D
    keys:
      - img
      - points
      - gt_bboxes_3d
      - gt_labels_3d
    meta_keys:
      - camera_intrinsics
      - camera2ego
      - lidar2ego
      - lidar2camera
      - camera2lidar
      - lidar2image
      - img_aug_matrix
      - lidar_aug_matrix

test_pipeline:
  -
    type: LoadMultiViewImageFromFiles
    to_float32: true
  -
    type: LoadPointsFromFile
    coord_type: LIDAR
    load_dim: ${load_dim}
    use_dim: ${use_dim}
  -
    type: LoadPointsFromMultiSweeps
    sweeps_num: ${max_sweeps}
    load_dim: ${load_dim}
    use_dim: ${use_dim}
    pad_empty_sweeps: false
    remove_close: false
    test_mode: true
  -
    type: LiDARCameraFrustumFilter
    min_depth: ${frustum_filter.min_depth}
    max_depth: ${frustum_filter.max_depth}
    margin_px: ${frustum_filter.margin_px}
    min_points: ${frustum_filter.min_points}
    min_keep_ratio: ${frustum_filter.min_keep_ratio}
    mode: ${frustum_filter.mode}
    on_threshold_failure: ${frustum_filter.on_threshold_failure}
  -
    type: LoadAnnotations3D
    with_bbox_3d: true
    with_label_3d: true
    with_attr_label: false
  -
    type: UAVImageAug3D
    final_dim: ${image_size}
    resize_lim: ${augment2d.resize[1]}
    bot_pct_lim: [0.0, 0.0]
    rot_lim: [0.0, 0.0]
    rand_flip: false
    is_train: false
    vertical_jitter: 0.0
  -
    type: GlobalRotScaleTrans
    resize_lim: [1.0, 1.0]
    rot_lim: [0.0, 0.0]
    trans_lim: 0.0
    is_train: false
  -
    type: PointsRangeFilter
    point_cloud_range: ${point_cloud_range}
  -
    type: ImageNormalize
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  -
    type: DefaultFormatBundle3D
    classes: ${object_classes}
  -
    type: Collect3D
    keys:
      - img
      - points
      - gt_bboxes_3d
      - gt_labels_3d
    meta_keys:
      - camera_intrinsics
      - camera2ego
      - lidar2ego
      - lidar2camera
      - camera2lidar
      - lidar2image
      - img_aug_matrix
      - lidar_aug_matrix

data:
  samples_per_gpu: 1
  workers_per_gpu: 0
  train:
    type: ${dataset_type}
    dataset_root: ${dataset_root}
    point_cloud_range: ${point_cloud_range}
    ann_file: ${dataset_root + "uavdataset_infos_train_s6.pkl"}
    pipeline: ${train_pipeline}
    object_classes: ${object_classes}
    modality: ${input_modality}
    test_mode: false
    filter_empty_gt: true
    use_valid_flag: true
    with_velocity: true
    box_type_3d: LiDAR
  val:
    type: ${dataset_type}
    dataset_root: ${dataset_root}
    point_cloud_range: ${point_cloud_range}
    ann_file: ${dataset_root + "uavdataset_infos_val_s6.pkl"}
    pipeline: ${test_pipeline}
    object_classes: ${object_classes}
    modality: ${input_modality}
    test_mode: false
    filter_empty_gt: false
    use_valid_flag: true
    with_velocity: true
    box_type_3d: LiDAR
  test:
    type: ${dataset_type}
    dataset_root: ${dataset_root}
    point_cloud_range: ${point_cloud_range}
    ann_file: ${dataset_root + "uavdataset_infos_test_s6.pkl"}
    pipeline: ${test_pipeline}
    object_classes: ${object_classes}
    modality: ${input_modality}
    test_mode: true
    filter_empty_gt: false
    use_valid_flag: true
    with_velocity: true
    box_type_3d: LiDAR

evaluation:
  interval: 1
  metric: bbox
  iou_threshold: 0.5
  score_threshold: 0.1

max_epochs: 20
